# pre-commit hooks — 自动化 AGENTS.md 核心检查（Ruff）
# [2026-10-02 扩展] 同日追加仓库级检查 hook：compile_po --check /
# check_version / check_runtime_pins / check_skill_agents_consistency（与 AGENTS.md
# 「格式化命令（检查唯一基准）」后 4 行同源），
# 同一目录下的 Ruff 行不再重复。回归锁：tests/test_pre_commit_config.py
# 将 AGENTS.md 章节清单与本文件的 hook entry 两侧同时钉住，任一边新增而另一边缺失即红。
# 安装: pip install pre-commit && pre-commit install
# 手动全量跑: pre-commit run --all-files
# 一次性本地检查入口：python scripts/run_gates.py（与本章 hook 互斥使用，避免 Ruff 跑两遍）
# 工具配置（line-length / target-version / exclude 等）统一读 pyproject.toml，此处不重复。

default_language_version:
  python: python3

repos:
  # ── 通用卫生检查（行尾空白 / 末尾换行 / YAML 语法等）──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # 排除生成物 / 运行期目录，与 pyproject [tool.ruff].extend-exclude 同源
        exclude: ^(node/|ffmpeg/|downloads/|logs/|\.venv/|__pycache__/|.*\.egg-info/)
      - id: end-of-file-fixer
        exclude: ^(node/|ffmpeg/|downloads/|logs/|\.venv/|__pycache__/|.*\.egg-info/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Ruff 使用 uv.lock 中的版本，提交钩子不维护第二套版本定义。
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --extra dev ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev ruff format
        language: system
        types: [python]
  # ── 仓库级检查（AGENTS.md「格式化命令（检查唯一基准）」bash 块的后 4 条）──
  # 全部使用项目解释器：language: system + pass_filenames: false，脚本自己按仓库根遍历；
  # always_run: true 保证「改了非 Python 文件也照样触发」——这四个脚本跨文件比对
  # （i18n .po/.mo、pyproject/main.py/Dockerfile 版本号、build_exe.py 钉定表、
  # .agents/skills/ 目录与 AGENTS.md「项目级 Skill」表），
  # 只看 staged 类型会漏查；require_serial: true 按仓库级范围执行。
  # 事实源仍是 AGENTS.md 那一节：新增/删除检查须同步本块与 tests/test_pre_commit_config.py 的回归锁。
  - repo: local
    hooks:
      - id: compile-po-check
        name: compile_po.py --check (.po/.mo 同步校验)
        entry: python scripts/compile_po.py --check
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
      - id: check-version
        name: check_version.py (版本号单一事实源动态化)
        entry: python scripts/check_version.py
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
      - id: check-runtime-pins
        name: check_runtime_pins.py (运行时二进制钉定表结构)
        entry: python scripts/check_runtime_pins.py
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
      - id: check-skill-agents
        name: check_skill_agents_consistency.py (Skill 目录与 AGENTS.md 表格一致性)
        entry: python scripts/check_skill_agents_consistency.py
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
