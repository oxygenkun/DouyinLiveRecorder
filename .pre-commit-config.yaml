# 提交时运行 Ruff、配置语法、文件大小检查。
# 安装：uv run --locked --extra dev pre-commit install
# 手动执行：uv run --locked --extra dev pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Ruff 使用 uv.lock 中的版本，提交钩子不维护第二套版本定义。
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --extra dev ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra dev ruff format
        language: system
        types: [python]
